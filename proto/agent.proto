syntax = "proto3";

package flexctl.agent.v1;

option go_package = "github.com/paul/flexctl/internal/agentpb;agentpb";

import "google/protobuf/timestamp.proto";

service Agent {
  // Stream is a long-lived bidirectional stream between an agent and the
  // control plane. The agent authenticates via the `node-token` metadata
  // header on stream open. First client message must be Register.
  rpc Stream(stream AgentMessage) returns (stream ControlMessage);
}

message AgentMessage {
  oneof payload {
    Register register = 1;
    Heartbeat heartbeat = 2;
    EnvReady env_ready                = 3;
    EnvStopped env_stopped            = 4;
    EnvDeleted env_deleted            = 5;
    EnvError env_error                = 6;
    EnvStateSnapshot env_snapshot     = 7;
  }
}

message ControlMessage {
  oneof payload {
    RegisterAck register_ack = 1;
    HeartbeatAck heartbeat_ack = 2;
    CreateEnv create_env  = 3;
    StopEnv   stop_env    = 4;
    StartEnv  start_env   = 5;
    DeleteEnv delete_env  = 6;
  }
}

message Register {
  string agent_version = 1;
  repeated GPU gpus = 2;
}

message Heartbeat {
  google.protobuf.Timestamp at = 1;
}

message RegisterAck {
  string node_id = 1;
}

message HeartbeatAck {}

message GPU {
  int32 index = 1;
  string model = 2;
  int32 vram_mb = 3;
}

message CreateEnv {
  string env_id            = 1;
  string image_ref         = 2;
  string sidecar_image_ref = 3;
  string hostname          = 4;
  string headscale_url     = 5;
  string preauth_key       = 6;
  repeated string tags     = 7;
  string authorized_keys   = 8;
  int32  gpu_request       = 9;
  repeated string default_cmd = 10;
}

message StopEnv  { string env_id = 1; }

message StartEnv {
  string env_id          = 1;
  string preauth_key     = 2;
  string authorized_keys = 3;
}

message DeleteEnv { string env_id = 1; }

message EnvReady {
  string env_id               = 1;
  string sidecar_container_id = 2;
  string dev_container_id     = 3;
  repeated int32 gpu_indices  = 4;
}

message EnvStopped { string env_id = 1; }

message EnvDeleted { string env_id = 1; }

message EnvError {
  string env_id = 1;
  string stage  = 2;
  string detail = 3;
}

message EnvStateSnapshot {
  repeated string running_env_ids = 1;
}
