services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: flex
      POSTGRES_PASSWORD: flex
      POSTGRES_DB: flex
    ports:
      - "5432:5432"
    volumes:
      - flex_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flex -d flex"]
      interval: 2s
      timeout: 2s
      retries: 10

volumes:
  flex_pg_data: {}
