services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: flex
      POSTGRES_PASSWORD: flex
      POSTGRES_DB: flex
    ports:
      - "5432:5432"
    volumes:
      - flex_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flex -d flex"]
      interval: 2s
      timeout: 2s
      retries: 10

  headscale:
    image: headscale/headscale:0.23.0
    command: ["serve"]
    volumes:
      - ./config/headscale.yaml:/etc/headscale/config.yaml:ro
      - flex_headscale_data:/var/lib/headscale
      - flex_headscale_run:/var/run/headscale
    ports:
      - "8088:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/ko-app/headscale", "users", "list"]
      interval: 3s
      timeout: 2s
      retries: 10

volumes:
  flex_pg_data: {}
  flex_headscale_data: {}
  flex_headscale_run: {}
