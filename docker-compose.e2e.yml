services:
  postgres-e2e:
    image: postgres:16
    environment:
      POSTGRES_USER: flex
      POSTGRES_PASSWORD: flex
      POSTGRES_DB: flex
    ports: ["5433:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flex -d flex"]
      interval: 2s
      timeout: 2s
      retries: 10

  headscale-e2e:
    image: headscale/headscale:0.23.0
    command: ["serve"]
    volumes:
      - ./config/headscale.yaml:/etc/headscale/config.yaml:ro
    ports: ["8090:8080"]
    depends_on:
      postgres-e2e:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/ko-app/headscale", "users", "list"]
      interval: 3s
      timeout: 2s
      retries: 10
